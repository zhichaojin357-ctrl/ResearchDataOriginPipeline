[project]
name = "researchdataoriginpipeline"
version = "0.1.0"
description = "Phase 1 planning scaffold for scientific characterization data processing and Origin export."
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "scipy",
  "openpyxl",
  "PyYAML",
  "pybaselines",
  "originpro",
  "pywin32",
  "Pillow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning:openpyxl\\.packaging\\.core",
  "ignore:Cython PyNumpress is not installed.*:ImportWarning",
  "ignore:Plotly is required for plotting support\\.:ImportWarning",
  "ignore:Importing from numpy\\.matlib is deprecated.*:PendingDeprecationWarning",
  "ignore:Importing from numpy\\.matlib is deprecated.*:PendingDeprecationWarning:pyimpspec\\.analysis\\.drt\\.tr_rbf",
  "ignore:Data type alias 'a' was deprecated in NumPy 2\\.0.*:DeprecationWarning:nmrglue\\.fileio\\.tecmag",
]
