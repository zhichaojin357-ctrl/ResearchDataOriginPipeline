version: data_selection_rules_v1
source_policy:
  original_data_read_only: true
  do_not_write_to_raw_data: true
  workspace_copy_required_for_real_batch: true
  current_workspace_copy: workspace_data/LL_detection_copy_20260530
  originally_requested_path: F:\课题\LL\检测中
  actual_copied_path: F:\课题\LL\检测

triage_thresholds:
  auto_process_min_confidence: 0.75
  auto_process_min_validity: 0.75
  manual_review_below_auto_threshold: true
  exclude_empty_files: true
  suppress_exact_duplicates: true

queue_rules:
  include_decisions:
    - AUTO_PROCESS
  exclude_decisions:
    - MANUAL_REVIEW
    - EXCLUDE_INVALID
    - DUPLICATE_SUPPRESSED
    - AUXILIARY_ONLY
    - DEFERRED_TYPE
    - REFERENCE_ONLY
  require_source_hash_match: true
  queue_paths:
    manifest: output/reports/data_triage_manifest.json
    queue: output/reports/processing_queue.json
    ambiguous: output/reports/ambiguous_files.md
    excluded: output/reports/excluded_files.md
    duplicates: output/reports/duplicate_candidates.md
    hash_index: output/reports/source_hash_index.json

origin_policy:
  routine_tests_launch_origin: false
  queue_processing_default_no_origin: true
  origin_export_requires_explicit_nonroutine_command: true
forbidden_processors:
  - kinetics
  - SEM
  - TEM
  - NMR
  - MS
